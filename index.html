<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile To-Do List App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="mobile-shell">
    <section class="todo-card" aria-labelledby="todo-heading">
      <!-- Header -->
      <header class="app-header">
        <div>
          <h1 id="todo-heading">My Tasks</h1>
          <p id="taskCounter" class="subtitle">0 tasks remaining</p>
        </div>
        <span class="badge">Mobile</span>
      </header>

      <!-- Add Task Form -->
      <form id="todoForm" class="todo-form" novalidate>
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task..."
          autocomplete="off"
          required
        />
        <button type="submit" class="add-btn">Add</button>
      </form>
      <small id="formError" class="error-text"></small>

      <!-- Filter Tabs -->
      <div class="filters" role="tablist" aria-label="Task filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Task List -->
      <ul id="todoList" class="todo-list" aria-live="polite"></ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" hidden>
        <p>No tasks here yet.</p>
        <span>Add a task above to get started.</span>
      </div>

      <!-- Footer Actions -->
      <footer class="card-footer">
        <button type="button" id="clearCompletedBtn" class="clear-btn">
          Clear Completed
        </button>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
